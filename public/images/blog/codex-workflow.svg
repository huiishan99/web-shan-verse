<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Codex supervised engineering loop</title>
  <desc id="desc">A five step workflow: plan, build, verify, devlog, commit.</desc>
  <rect width="1280" height="720" rx="36" fill="#101016"/>
  <rect x="48" y="48" width="1184" height="624" rx="28" fill="#16161f" stroke="#3b3320" stroke-width="2"/>
  <g opacity="0.42">
    <path d="M108 556 C250 460 342 626 482 532 C622 438 728 574 864 472 C1000 370 1060 462 1172 358" stroke="#c9a227" stroke-width="2"/>
    <path d="M108 584 C250 488 344 652 482 560 C626 464 734 604 868 500 C1010 392 1064 496 1172 390" stroke="#7f6a28" stroke-width="2"/>
  </g>
  <text x="96" y="116" fill="#f3ead2" font-family="Inter, system-ui, sans-serif" font-size="36" font-weight="700">Supervised Codex Loop</text>
  <text x="96" y="154" fill="#c8c0aa" font-family="Inter, system-ui, sans-serif" font-size="18">Treat the agent as an execution layer: scoped, verified, logged, and committed.</text>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c9a227"/>
    </marker>
  </defs>
  <g filter="url(#shadow)">
    <rect x="96" y="246" width="176" height="134" rx="18" fill="#20202a" stroke="#5b4b21"/>
    <text x="128" y="300" fill="#f6e8bd" font-family="Inter, system-ui, sans-serif" font-size="23" font-weight="700">1. Plan</text>
    <text x="128" y="334" fill="#c8c0aa" font-family="Inter, system-ui, sans-serif" font-size="15">Read repo</text>
    <text x="128" y="358" fill="#c8c0aa" font-family="Inter, system-ui, sans-serif" font-size="15">Define scope</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="330" y="246" width="176" height="134" rx="18" fill="#20202a" stroke="#5b4b21"/>
    <text x="362" y="300" fill="#f6e8bd" font-family="Inter, system-ui, sans-serif" font-size="23" font-weight="700">2. Build</text>
    <text x="362" y="334" fill="#c8c0aa" font-family="Inter, system-ui, sans-serif" font-size="15">Small diff</text>
    <text x="362" y="358" fill="#c8c0aa" font-family="Inter, system-ui, sans-serif" font-size="15">Keep it runnable</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="564" y="246" width="176" height="134" rx="18" fill="#20202a" stroke="#5b4b21"/>
    <text x="596" y="300" fill="#f6e8bd" font-family="Inter, system-ui, sans-serif" font-size="23" font-weight="700">3. Verify</text>
    <text x="596" y="334" fill="#c8c0aa" font-family="Inter, system-ui, sans-serif" font-size="15">Tests</text>
    <text x="596" y="358" fill="#c8c0aa" font-family="Inter, system-ui, sans-serif" font-size="15">Screenshots</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="798" y="246" width="176" height="134" rx="18" fill="#20202a" stroke="#5b4b21"/>
    <text x="830" y="300" fill="#f6e8bd" font-family="Inter, system-ui, sans-serif" font-size="23" font-weight="700">4. Devlog</text>
    <text x="830" y="334" fill="#c8c0aa" font-family="Inter, system-ui, sans-serif" font-size="15">Record decisions</text>
    <text x="830" y="358" fill="#c8c0aa" font-family="Inter, system-ui, sans-serif" font-size="15">Trace bugs later</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1032" y="246" width="176" height="134" rx="18" fill="#20202a" stroke="#5b4b21"/>
    <text x="1064" y="300" fill="#f6e8bd" font-family="Inter, system-ui, sans-serif" font-size="23" font-weight="700">5. Commit</text>
    <text x="1064" y="334" fill="#c8c0aa" font-family="Inter, system-ui, sans-serif" font-size="15">Checkpoint</text>
    <text x="1064" y="358" fill="#c8c0aa" font-family="Inter, system-ui, sans-serif" font-size="15">Rollback path</text>
  </g>
  <path d="M276 313 H322" stroke="#c9a227" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M510 313 H556" stroke="#c9a227" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M744 313 H790" stroke="#c9a227" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M978 313 H1024" stroke="#c9a227" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1120 390 C1120 486 184 486 184 390" stroke="#c9a227" stroke-width="3" stroke-dasharray="9 10" marker-end="url(#arrow)"/>
  <text x="470" y="520" fill="#c8c0aa" font-family="Inter, system-ui, sans-serif" font-size="18">Every loop returns to scope, because the human still owns judgment.</text>
</svg>
